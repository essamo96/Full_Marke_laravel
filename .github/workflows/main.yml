name: 🚀 Deploy Website to Full_Marke_laravel

on:
  push:
    branches:
      - main

jobs:
  web-deploy:
    name: 🎉 Running Deployment Process
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v3

      - name: 🐘 Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"

      - name: 💾 Cache Composer dependencies
        uses: actions/cache@v3
        with:
          path: ~/.composer/cache
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: 📦 Install Composer dependencies
        run: composer install --no-dev --optimize-autoloader --prefer-dist

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "20"
          cache: "npm" # تفعيل الكاش لـ Node.js لتسريع العملية

      - name: 🔨 Build Frontend Assets (Vite)
        run: |
          npm ci # أفضل من npm install في بيئات الـ CI/CD
          npm run build

      - name: 🗑️ Remove excluded files before upload
        run: |
          rm -rf .git tests node_modules
      - name: 📦 Prepare Zip and Unzip Script
        run: |
          zip -rq build.zip . -x "*.git*" "*node_modules*" "*tests*"
          cat << 'EOF' > unzip.php
          <?php
          $zip = new ZipArchive;
          if ($zip->open('build.zip') === TRUE) {
              $zip->extractTo(__DIR__);
              $zip->close();
              unlink('build.zip');
              unlink(__FILE__);
              echo 'UNZIP_SUCCESS';
          } else {
              echo 'UNZIP_FAILED';
          }
          EOF

      - name: 🛠️ Install lftp
        run: sudo apt-get update -y || true; sudo apt-get install -y lftp

      - name: 📂 Upload Zip to Server (via FTP)
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_wait_seconds: 10
          shell: bash
          command: |
            lftp -u "${{ secrets.FTP_USERNAME }}","${{ secrets.FTP_PASSWORD }}" 92.113.19.218 <<'EOF'
            set ssl:verify-certificate no
            set ftp:ssl-allow true
            set ftp:ssl-force true
            cd /domains/fullmarkacademy.com/public_html/
            put build.zip
            put unzip.php
            EOF

      - name: 🚀 Extract on Server
        run: |
          RESPONSE=$(curl -sS -H "Host: fullmarkacademy.com" http://92.113.19.218/unzip.php || echo "CURL_ERROR")
          echo "Server Response: $RESPONSE"
          if [[ "$RESPONSE" == *"UNZIP_SUCCESS"* ]]; then
            echo "✅ Successfully extracted on server!"
          else
            echo "❌ Failed to extract!"
            exit 1
          fi
