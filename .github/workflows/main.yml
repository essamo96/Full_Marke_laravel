name: 🚀 Deploy Website to Full_Marke_laravel

on:
  push:
    branches:
      - main

jobs:
  web-deploy:
    name: 🎉 Running Deployment Process
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v3

      - name: 🐘 Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"

      - name: 💾 Cache Composer dependencies
        uses: actions/cache@v3
        with:
          path: ~/.composer/cache
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: 📦 Install Composer dependencies
        run: composer install --no-dev --optimize-autoloader --prefer-dist

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "20"
          cache: "npm" # تفعيل الكاش لـ Node.js لتسريع العملية

      - name: 🔨 Build Frontend Assets (Vite)
        run: |
          npm ci # أفضل من npm install في بيئات الـ CI/CD
          npm run build

      - name: 🗑️ Remove excluded files before upload
        run: |
          rm -rf .git tests node_modules
          rm -f .env .env.example phpunit.xml README.md docker-compose.yml docker-compose.override.yml .editorconfig .styleci.yml
          find storage -name "*.key" -delete || true

      - name: 🛠️ Install sshpass
        run: sudo apt-get update -y || true; sudo apt-get install -y sshpass rsync

      - name: 📂 Sync files to Server (Rsync over SSH)
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_wait_seconds: 10
          shell: bash
          command: |
            sshpass -p "${{ secrets.SSH_PASSWORD }}" rsync -avz \
              --exclude '.git/' \
              --exclude 'node_modules/' \
              --exclude 'tests/' \
              -e "ssh -p 65002 -o StrictHostKeyChecking=no" \
              ./ u515448360@92.113.19.218:/domains/fullmarkacademy.com/public_html/
