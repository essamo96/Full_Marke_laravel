name: 🚀 Deploy Website to Full_Marke_laravel

on:
  push:
    branches:
      - main

jobs:
  web-deploy:
    name: 🎉 Running Deployment Process
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v3

      - name: 🐘 Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: 📦 Install Composer dependencies
        run: composer install --no-dev --optimize-autoloader --prefer-dist

      # --- تمت إضافة خطوة الواجهة الأمامية هنا ---
      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: 🔨 Build Frontend Assets (Vite)
        run: |
          npm install
          npm run build
      # ----------------------------------------

      - name: 🗑️ Remove excluded files before upload
        run: |
          rm -rf .git tests node_modules
          rm -f .env .env.example phpunit.xml README.md docker-compose.yml docker-compose.override.yml .editorconfig .styleci.yml
          find storage -name "*.key" -delete || true

      - name: 📂 Sync files to Server (lftp mirror with auto-retry/resume)
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 120
          max_attempts: 8
          retry_wait_seconds: 20
          shell: bash
          command: |
            sudo apt-get update -y && sudo apt-get install -y lftp
            lftp -u "${{ secrets.FTP_USERNAME }}","${{ secrets.FTP_PASSWORD }}" 92.113.19.218 <<'EOF'
            set ftp:ssl-allow no
            set net:max-retries 5
            set net:timeout 30
            set net:reconnect-interval-base 10
            set net:reconnect-interval-max 60
            set mirror:use-pget-n 1
            mirror --reverse --continue --verbose --parallel=3 \
              --exclude-glob=.git* \
              --exclude-glob=node_modules/ \
              --exclude-glob=tests/ \
              ./ /domains/fullmarkacademy.com/public_html/
            EOF
