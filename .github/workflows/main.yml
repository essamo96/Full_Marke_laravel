name: 🚀 Deploy Website to Full_Marke_laravel

on:
  push:
    branches:
      - main

jobs:
  web-deploy:
    name: 🎉 Running Deployment Process
    runs-on: ubuntu-latest
    timeout-minutes: 720

    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v3

      - name: 🐘 Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"

      - name: 💾 Cache Composer dependencies
        uses: actions/cache@v3
        with:
          path: ~/.composer/cache
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: 📦 Install Composer dependencies
        timeout-minutes: 60
        run: composer install --no-interaction --no-progress --no-dev --optimize-autoloader --prefer-dist

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "20"
          cache: "npm" # تفعيل الكاش لـ Node.js لتسريع العملية

      - name: 🔨 Build Frontend Assets (Vite)
        timeout-minutes: 90
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: 📂 Sync files to Server (FTP Deploy Action, FTPS)
        # This action keeps a state file (.ftp-deploy-sync-state.json) on the
        # server and diffs against it on every run, so it uploads only files
        # that actually changed since the last successful deploy (and removes
        # only files that were actually deleted) instead of re-mirroring
        # everything like the previous lftp-based step did.
        #
        # Retried below up to 3 times total. Plain FTP started failing with
        # "Timeout (control socket)" on every attempt — the host likely
        # firewalls/drops unencrypted FTP from cloud IPs while still
        # allowing FTPS, so the retries alternate protocol (FTPS/FTP/FTPS)
        # instead of blindly repeating the same failing config three times.
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        id: ftp-deploy
        continue-on-error: true
        with:
          server: 92.113.19.218
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          server-dir: /domains/fullmarkacademy.com/public_html/
          dangerous-clean-slate: false
          exclude: |
            .git*
            .git*/**
            .github/**
            node_modules/**
            vendor/**
            tests/**
            storage/app/**
            storage/framework/**
            storage/logs/**
            storage/*.key
            .env
            .env.example
            phpunit.xml
            README.md
            docker-compose.yml
            docker-compose.override.yml
            .editorconfig
            .styleci.yml

      - name: 🔁 Retry Sync if first attempt failed (plain FTP)
        if: steps.ftp-deploy.outcome == 'failure'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        id: ftp-deploy-retry-1
        continue-on-error: true
        with:
          server: 92.113.19.218
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          server-dir: /domains/fullmarkacademy.com/public_html/
          dangerous-clean-slate: false
          exclude: |
            .git*
            .git*/**
            .github/**
            node_modules/**
            vendor/**
            tests/**
            storage/app/**
            storage/framework/**
            storage/logs/**
            storage/*.key
            .env
            .env.example
            phpunit.xml
            README.md
            docker-compose.yml
            docker-compose.override.yml
            .editorconfig
            .styleci.yml

      - name: 🔁 Retry Sync (final attempt, verbose FTPS)
        if: steps.ftp-deploy.outcome == 'failure' && steps.ftp-deploy-retry-1.outcome == 'failure'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        id: ftp-deploy-retry-2
        continue-on-error: true
        with:
          server: 92.113.19.218
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          server-dir: /domains/fullmarkacademy.com/public_html/
          dangerous-clean-slate: false
          log-level: verbose
          exclude: |
            .git*
            .git*/**
            .github/**
            node_modules/**
            vendor/**
            tests/**
            storage/app/**
            storage/framework/**
            storage/logs/**
            storage/*.key
            .env
            .env.example
            phpunit.xml
            README.md
            docker-compose.yml
            docker-compose.override.yml
            .editorconfig
            .styleci.yml

      - name: ❗ Fail the job if every deploy attempt failed
        # continue-on-error above means a failed sync wouldn't otherwise mark
        # the workflow run red — make the failure visible instead of silently
        # "succeeding" with nothing deployed.
        if: steps.ftp-deploy.outcome == 'failure' && steps.ftp-deploy-retry-1.outcome == 'failure' && steps.ftp-deploy-retry-2.outcome == 'failure'
        run: |
          echo "All 3 deploy attempts (FTPS, FTP, FTPS) failed to connect."
          echo "This points to a network/firewall block between GitHub Actions and the host, not a code issue — check FTP/FTPS access with the hosting provider."
          exit 1

