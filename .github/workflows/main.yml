name: 🚀 Deploy Website to Full_Marke_laravel

on:
  push:
    branches:
      - main

jobs:
  web-deploy:
    name: 🎉 Running Deployment Process
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v3

      - name: 🐘 Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"

      - name: 💾 Cache Composer dependencies
        uses: actions/cache@v3
        with:
          path: ~/.composer/cache
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: 📦 Install Composer dependencies
        run: composer install --no-dev --optimize-autoloader --prefer-dist

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "20"
          cache: "npm" # تفعيل الكاش لـ Node.js لتسريع العملية

      - name: 🔨 Build Frontend Assets (Vite)
        run: |
          npm ci # أفضل من npm install في بيئات الـ CI/CD
          npm run build

      - name: 🗑️ Remove excluded files before upload
        run: |
          rm -rf .git tests node_modules
          rm -f .env .env.example phpunit.xml README.md docker-compose.yml docker-compose.override.yml .editorconfig .styleci.yml
          find storage -name "*.key" -delete || true

      # --- تم فصل تثبيت lftp هنا ليعمل مرة واحدة فقط ---
      - name: 🛠️ Install lftp
        run: sudo apt-get update -y && sudo apt-get install -y lftp

      - name: 📂 Sync files to Server (lftp mirror with auto-retry/resume)
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 120
          max_attempts: 8
          retry_wait_seconds: 20
          shell: bash
          command: |
            lftp -u "${{ secrets.FTP_USERNAME }}","${{ secrets.FTP_PASSWORD }}" 92.113.19.218 <<'EOF'
            set ftp:ssl-allow no
            set net:max-retries 5
            set net:timeout 30
            set net:reconnect-interval-base 10
            set net:reconnect-interval-max 60
            set mirror:use-pget-n 1
            mirror --reverse --continue --only-newer --verbose --parallel=10 \
              --exclude-glob=.git* \
              --exclude-glob=node_modules/ \
              --exclude-glob=tests/ \
              ./ /domains/fullmarkacademy.com/public_html/
            EOF
