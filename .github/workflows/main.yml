name: 🚀 Deploy Website to Full_Marke_laravel

on:
  push:
    branches:
      - main

jobs:
  web-deploy:
    name: 🎉 Running Deployment Process
    runs-on: ubuntu-latest
    timeout-minutes: 720

    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v3

      - name: 🐘 Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"

      - name: 💾 Cache Composer dependencies
        uses: actions/cache@v3
        with:
          path: ~/.composer/cache
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: 📦 Install Composer dependencies
        timeout-minutes: 60
        run: composer install --no-interaction --no-progress --no-dev --optimize-autoloader --prefer-dist

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "20"
          cache: "npm" # تفعيل الكاش لـ Node.js لتسريع العملية

      - name: 🔨 Build Frontend Assets (Vite)
        timeout-minutes: 90
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: 📂 Sync files to Server (lftp)
        timeout-minutes: 60
        env:
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail
          sudo DEBIAN_FRONTEND=noninteractive apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq lftp
          timeout 3300s lftp -c "
            set ftp:ssl-allow no;
            set net:timeout 60;
            set net:max-retries 5;
            set net:reconnect-interval-base 5;
            set net:reconnect-interval-max 30;
            set xfer:clobber boolean true;
            open -u \"$FTP_USERNAME\",\"$FTP_PASSWORD\" ftp://92.113.19.218;
            mirror -R -v --only-newer --parallel=2 --no-empty-dirs \
              --exclude-glob .git/ \
              --exclude-glob .github/ \
              --exclude-glob node_modules/ \
              --exclude-glob vendor/ \
              --exclude-glob tests/ \
              --exclude-glob storage/app/ \
              --exclude-glob storage/framework/ \
              --exclude-glob storage/logs/ \
              --exclude-glob 'storage/*.key' \
              --exclude-glob .env \
              --exclude-glob .env.example \
              --exclude-glob phpunit.xml \
              --exclude-glob README.md \
              --exclude-glob docker-compose.yml \
              --exclude-glob docker-compose.override.yml \
              --exclude-glob .editorconfig \
              --exclude-glob .styleci.yml \
              ./ /domains/fullmarkacademy.com/public_html/"
