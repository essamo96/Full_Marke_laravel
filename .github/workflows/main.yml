name: 🚀 Deploy Website to Full_Marke_laravel

on:
  push:
    branches:
      - main

jobs:
  web-deploy:
    name: 🎉 Running Deployment Process
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v3

      - name: 🐘 Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"

      - name: 💾 Cache Composer dependencies
        uses: actions/cache@v3
        with:
          path: ~/.composer/cache
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: 📦 Install Composer dependencies
        run: composer install --no-dev --optimize-autoloader --prefer-dist

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "20"
          cache: "npm" # تفعيل الكاش لـ Node.js لتسريع العملية

      - name: 🔨 Build Frontend Assets (Vite)
        run: |
          npm ci # أفضل من npm install في بيئات الـ CI/CD
          npm run build

      - name: 📂 Sync files to Server (lftp)
        env:
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          sudo apt-get update && sudo apt-get install -y lftp
          lftp -c "set ftp:ssl-allow no; open -u ${{ secrets.FTP_USERNAME }},\"$FTP_PASSWORD\" ftp://92.113.19.218; mirror -R -v --parallel=10 \
            --exclude-glob .git/ \
            --exclude-glob node_modules/ \
            --exclude-glob vendor/ \
            --exclude-glob tests/ \
            --exclude-glob 'storage/*.key' \
            --exclude-glob .env \
            --exclude-glob .env.example \
            --exclude-glob phpunit.xml \
            --exclude-glob README.md \
            --exclude-glob docker-compose.yml \
            --exclude-glob docker-compose.override.yml \
            --exclude-glob .editorconfig \
            --exclude-glob .styleci.yml \
            ./ /domains/fullmarkacademy.com/public_html/"
