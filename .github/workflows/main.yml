name: 🚀 Deploy Website to Full_Marke_laravel

on:
  push:
    branches:
      - main

jobs:
  web-deploy:
    name: 🎉 Running Deployment Process
    runs-on: ubuntu-latest
    timeout-minutes: 720

    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: 🕒 Restore real file timestamps from git history
        # actions/checkout stamps every file with the checkout time, not its
        # actual last-modified commit time. That breaks lftp's
        # "mirror --only-newer" below — every file looks newer than what's
        # already on the server, so it re-uploads everything on every deploy.
        # Setting each tracked file's mtime back to its last commit date lets
        # --only-newer correctly skip files that haven't actually changed.
        run: |
          git log --pretty=format:'%ct' --name-only --diff-filter=ACMR | awk '
            /^[0-9]+$/ { ts = $0; next }
            NF { if (!($0 in seen)) { print ts, $0; seen[$0] = 1 } }
          ' > /tmp/mtimes.txt
          while IFS=' ' read -r ts file; do
            [ -f "$file" ] && touch -d "@$ts" "$file"
          done < /tmp/mtimes.txt

      - name: 🐘 Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"

      - name: 💾 Cache Composer dependencies
        uses: actions/cache@v3
        with:
          path: ~/.composer/cache
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: 📦 Install Composer dependencies
        timeout-minutes: 60
        run: composer install --no-interaction --no-progress --no-dev --optimize-autoloader --prefer-dist

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "20"
          cache: "npm" # تفعيل الكاش لـ Node.js لتسريع العملية

      - name: 🔨 Build Frontend Assets (Vite)
        timeout-minutes: 90
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: 📂 Sync files to Server (lftp)
        timeout-minutes: 90
        env:
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail
          sudo DEBIAN_FRONTEND=noninteractive apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq lftp
          timeout 5100s lftp -c "
            set ftp:ssl-allow no;
            set ftp:passive-mode yes;
            set net:timeout 30;
            set net:max-retries 3;
            set net:reconnect-interval-base 5;
            set net:reconnect-interval-max 10;
            set xfer:clobber boolean true;
            open -u \"$FTP_USERNAME\",\"$FTP_PASSWORD\" ftp://92.113.19.218;
            mirror -R -v --only-newer --parallel=1 --no-empty-dirs \
              --exclude-glob .git/ \
              --exclude-glob .github/ \
              --exclude-glob node_modules/ \
              --exclude-glob vendor/ \
              --exclude-glob tests/ \
              --exclude-glob storage/app/ \
              --exclude-glob storage/framework/ \
              --exclude-glob storage/logs/ \
              --exclude-glob 'storage/*.key' \
              --exclude-glob .env \
              --exclude-glob .env.example \
              --exclude-glob phpunit.xml \
              --exclude-glob README.md \
              --exclude-glob docker-compose.yml \
              --exclude-glob docker-compose.override.yml \
              --exclude-glob .editorconfig \
              --exclude-glob .styleci.yml \
              ./ /domains/fullmarkacademy.com/public_html/"
